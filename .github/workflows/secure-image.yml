name: Build secure image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fulfillment-at-rest-encryption

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - run: go test ./...

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kinzie-uuu/dujiao-next:secure-latest
            ghcr.io/kinzie-uuu/dujiao-next:secure-${{ github.sha }}
